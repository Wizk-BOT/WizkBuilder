name: Test pull images
on:
  workflow_dispatch:
  pull_request:
  workflow_run:
    workflows: ["Publish builder to GHCR"]
    types: [completed]

jobs:
  pull-smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      packages: read
    strategy:
      matrix:
        tag: [base, cpp-py, full, latest]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull image
        run: docker pull ghcr.io/wizk-modz/builder:${{ matrix.tag }}
      - name: Smoke test base (all tags)
        run: |
          docker run --rm ghcr.io/wizk-modz/builder:${{ matrix.tag }} whoami | grep -x builder
          docker run --rm ghcr.io/wizk-modz/builder:${{ matrix.tag }} bash -c 'echo $LANG | grep -x en_US.UTF-8'
          docker run --rm ghcr.io/wizk-modz/builder:${{ matrix.tag }} sudo -n true && echo "sudo OK"
      - name: Smoke test cpp-py (cpp-py/full/latest)
        if: ${{ matrix.tag != 'base' }}
        run: |
          docker run --rm ghcr.io/wizk-modz/builder:${{ matrix.tag }} gcc --version
          docker run --rm ghcr.io/wizk-modz/builder:${{ matrix.tag }} cmake --version
          docker run --rm ghcr.io/wizk-modz/builder:${{ matrix.tag }} python3 --version
      - name: Smoke test full (full/latest)
        if: ${{ matrix.tag == 'full' || matrix.tag == 'latest' }}
        run: |
          docker run --rm ghcr.io/wizk-modz/builder:${{ matrix.tag }} node --version
          docker run --rm ghcr.io/wizk-modz/builder:${{ matrix.tag }} go version
          docker run --rm ghcr.io/wizk-modz/builder:${{ matrix.tag }} cargo --version
          docker run --rm ghcr.io/wizk-modz/builder:${{ matrix.tag }} java --version
          docker run --rm ghcr.io/wizk-modz/builder:${{ matrix.tag }} docker --version
          docker run --rm ghcr.io/wizk-modz/builder:${{ matrix.tag }} gh --version
